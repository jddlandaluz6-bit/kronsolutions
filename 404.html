<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada — Kron Solutions</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>
  .error-page{
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;background:radial-gradient(120% 100% at 15% 0%,var(--forest-700) 0%,var(--forest-900) 48%,var(--graphite-900) 100%);

  .error-page h1{font-size:clamp(64px,14vw,140px);color:var(--bronze-300);margin-bottom:8px;}
  .error-page p{color:rgba(250,248,243,.75);font-size:18px;margin-bottom:32px;max-width:440px;}

</head>
<body>
  <div class="error-page">
    <h1>404</h1>
    <p>La página que buscas no existe o ha sido movida.</p>
    <a href="/" class="btn btn--primary">Volver al inicio</a>
  </div>
</body>
</html>
