<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="diamondBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8FF2FF"/>
      <stop offset="55%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0E8FA8"/>
    </linearGradient>
    <linearGradient id="diamondFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2440"/>
      <stop offset="100%" stop-color="#081222"/>
    </linearGradient>
    <filter id="diamondGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#diamondGlow)">
    <rect x="21" y="21" width="58" height="58" rx="9" transform="rotate(45 50 50)" fill="url(#diamondFill)" stroke="url(#diamondBorder)" stroke-width="4.5"/>
  </g>
  <text x="50" y="60" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="27" letter-spacing="0.5" fill="#F4FBFD">KS</text>
</svg>
