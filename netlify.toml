# Solo se publican los archivos de la web (HTML, TXT, XML y carpetas assets/css/js).
# Los documentos internos (ROADMAP.md, README.md, PDFs) nunca llegan a la web.
[build]
  publish = "dist"
  command = "rm -rf dist && mkdir dist && cp -r *.html *.txt *.xml assets css js dist/"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
